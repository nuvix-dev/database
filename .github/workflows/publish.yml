name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # TODO: remove continue-on-error once the 9 pre-existing test failures
    # (6x Doc.toObject, 2x generateTypes, 1x json filter) are fixed — this
    # job then becomes a hard gate for publish.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        # Mirrors docker-compose.yml: bun:test accumulates one SQL pool per
        # test file before cleanup hooks run.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuvix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432/nuvix_test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      # Determine release tag based on the tag name
      - name: Determine release tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == *"-rc"* ]] || [[ "${{ github.ref }}" == *"-RC"* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      # Publish to NPM with the appropriate tag.
      # bun publish reads NPM_CONFIG_TOKEN in CI environments.
      - name: Publish
        run: bun publish --tag ${{ steps.release_tag.outputs.tag }} --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
